name: Deploy HTML gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# deploy-pages 要求 run 内产物名唯一，固定名 "github-pages" 遇到残留/重跑会报
# "Multiple artifacts named github-pages"，用 run_id 保证每次运行的名字都不同
env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate index.html
        run: python3 _generator/generate_index.py

      - name: Inject home buttons into pages
        run: python3 _generator/inject_home_button.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}