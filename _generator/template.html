<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📂 HTML 作品集</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151c2c;
      --border: #243049;
      --text: #e6edf7;
      --muted: #8b98b0;
      --accent: #6ea8fe;
      --accent-hover: #5b95f0;
      --group-bg: #111827;
      --input-bg: #1a2236;
    }
    [data-theme="light"] {
      --bg: #f0f2f8;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --group-bg: #f8fafc;
      --input-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 80px;
      transition: background .3s, color .3s;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px; }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    header h1 {
      font-size: 24px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header p { color: var(--muted); margin: 0; font-size: 14px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* 搜索栏 */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .theme-toggle {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: all .2s;
      white-space: nowrap;
    }
    .theme-toggle:hover { border-color: var(--accent); }

    /* 分组 */
    .group { margin-top: 32px; }
    .group-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-count {
      font-size: 12px;
      background: var(--border);
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 400;
    }

    /* 卡片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(110,168,254,.12);
    }
    .card:active { transform: scale(0.98); }
    .card-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
    .card-title {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-path {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
    }

    .empty { color: var(--muted); padding: 40px 0; text-align: center; }

    footer {
      margin-top: 48px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* 搜索无结果 */
    .no-result {
      display: none;
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
    }
    .no-result.show { display: block; }

    /* 移动端 */
    @media (max-width: 640px) {
      .wrap { padding: 20px 16px; }
      header h1 { font-size: 20px; }
      .search-bar { flex-direction: column; }
      .theme-toggle { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📂 HTML 实验室</h1>
      <p>自动扫描 · 实时搜索 · 按目录分组</p>
      <div class="meta">共 {{ count }} 个页面 · 更新于 {{ generated_at }}</div>
      <div class="search-bar">
        <input class="search-input" id="searchInput" type="text" placeholder="搜索页面名称或路径..." />
        <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
      </div>
    </header>

    <main id="mainContent">
      {{ sections }}
      <div class="no-result" id="noResult">🔍 没有匹配的页面</div>
    </main>

    <footer>Auto-generated by GitHub Actions · push 即更新</footer>
  </div>

  <script>
    // 搜索过滤
    const searchInput = document.getElementById('searchInput');
    const noResult = document.getElementById('noResult');
    searchInput.addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.card');
      const groups = document.querySelectorAll('.group');
      let anyVisible = false;

      groups.forEach(group => {
        let groupVisible = false;
        const groupCards = group.querySelectorAll('.card');
        groupCards.forEach(card => {
          const text = card.dataset.search || '';
          if (text.includes(q)) {
            card.style.display = '';
            groupVisible = true;
            anyVisible = true;
          } else {
            card.style.display = 'none';
          }
        });
        group.style.display = groupVisible ? '' : 'none';
      });

      noResult.classList.toggle('show', !anyVisible && q.length > 0);
    });

    // 明暗主题
    const themeToggle = document.getElementById('themeToggle');
    const stored = localStorage.getItem('theme') || 'dark';
    document.documentElement.dataset.theme = stored;
    updateToggleLabel(stored);

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.dataset.theme;
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      updateToggleLabel(next);
    });

    function updateToggleLabel(theme) {
      themeToggle.textContent = theme === 'dark' ? '🌙 暗色' : '☀️ 亮色';
    }
  </script>
</body>
</html>
